name: kci-probe

# KCI Open API 연결·응답구조 점검 (로그 출력만, 커밋·데이터 저장 없음)
on:
  workflow_dispatch: {}
  push:
    branches: [claude/wizardly-fermi-mrihtw]
    paths: [agents/kci_probe.py, .github/workflows/kci-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      - name: KCI 점검
        env:
          KCI_API_KEY: ${{ secrets.KCI_API_KEY }}
        run: python agents/kci_probe.py
