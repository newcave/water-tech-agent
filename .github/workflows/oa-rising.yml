name: oa-rising

# openalex(newcave/openalex) 상승 연구주제 분석 결과 → 집계만 공개 (data_seed/oa_rising/)
# 원본·결과는 비공개 저장소 newcave/openalex-data. 결과 폴더만 받아(논문 전체 목록·코퍼스 원본 제외) agents/oa_rising.py가 집계.
# 준비: secrets.OPENALEX_DATA_TOKEN = newcave/openalex-data만 Contents: Read-only인 fine-grained PAT
#       (없으면 경고만 남기고 건너뜀 — 실패로 처리하지 않음)
on:
  schedule:
    - cron: "23 22 * * 0"        # 매주 일요일 22:23 UTC (월요일 07:23 KST) — kci-rising 다음
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oa-rising
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: 토큰 확인
        id: tok
        env:
          T: ${{ secrets.OPENALEX_DATA_TOKEN }}
        run: |
          if [ -n "$T" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::OPENALEX_DATA_TOKEN이 없어 openalex 결과 연동을 건너뜁니다 (Settings → Secrets → Actions)"; echo "ok=0" >> "$GITHUB_OUTPUT"; fi

      - name: openalex-data 결과 폴더만 체크아웃 (비공개 · 읽기 전용)
        if: steps.tok.outputs.ok == '1'
        uses: actions/checkout@v7
        with:
          repository: newcave/openalex-data
          token: ${{ secrets.OPENALEX_DATA_TOKEN }}
          path: oadata
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /results/*/02_full_period/
            /results/*/03_full_period_review/
            /results/*/04_windowed/
            /archive/수자원_논문/results/02_full_period/
            /archive/수자원_논문/results/03_full_period_review/
            /archive/수자원_논문/results/04_windowed/
            !/results/*/03_full_period_review/all_papers.csv
            !/archive/수자원_논문/results/03_full_period_review/all_papers.csv
            !**/network.html

      - uses: actions/setup-python@v7
        if: steps.tok.outputs.ok == '1'
        with:
          python-version: "3.11"
      - if: steps.tok.outputs.ok == '1'
        run: pip install --quiet pandas pyarrow

      - name: 집계 (공개 범위만)
        if: steps.tok.outputs.ok == '1'
        env:
          OA_DATA_DIR: oadata
        run: python agents/oa_rising.py

      - name: 집계 커밋 → 공개 저장소 (main만)
        id: commit
        if: steps.tok.outputs.ok == '1' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "co-scientist-bot"
          git config user.email "co-scientist-bot@users.noreply.github.com"
          git add data_seed/oa_rising
          # 내용이 같으면 oa_rising.py가 파일을 다시 쓰지 않으므로 갱신 시각만 바뀐 커밋은 생기지 않음
          if git diff --cached --quiet -- data_seed/oa_rising; then echo "변경 없음"; echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "🤖 oa_rising: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && { echo "changed=1" >> "$GITHUB_OUTPUT"; exit 0; }
            sleep 10
          done
          echo "push 실패(3회)"; exit 1

      # 관제센터 함대 카드·활동 피드·🌊 흐름 화면용 심박 — 토큰이 없거나 실패해도 기록 (상태를 정직하게)
      - name: 심박 → data 브랜치 live/agents/oa_rising.json
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          OA_TOKEN_OK: ${{ steps.tok.outputs.ok }}
          OA_JOB_OK: ${{ job.status == 'success' && '1' || '0' }}
          OA_CHANGED: ${{ steps.commit.outputs.changed || '0' }}
          OA_HB_PREV: /tmp/hb_prev.json
          OA_HB_OUT: /tmp/hb.json
        run: |
          API="repos/$GITHUB_REPOSITORY/contents/live/agents/oa_rising.json"
          git pull -q --rebase origin main || true          # 방금 커밋한 집계로 심박 숫자를 만든다
          if gh api "$API?ref=data" > /tmp/hb_meta.json 2>/dev/null; then
            python3 -c "import json,base64;d=json.load(open('/tmp/hb_meta.json'));open('/tmp/hb_prev.json','wb').write(base64.b64decode(d['content']));print(d['sha'])" > /tmp/hb_sha
          fi
          python3 agents/oa_rising_heartbeat.py
          for i in 1 2 3; do
            SHA=$(cat /tmp/hb_sha 2>/dev/null || true)
            ARGS=(-X PUT "$API" -f message="🤖 oa_rising 심박 $(date -u +'%Y-%m-%d %H:%M UTC')" -f branch=data -f content="$(base64 -w0 /tmp/hb.json)")
            [ -n "$SHA" ] && ARGS+=(-f sha="$SHA")
            gh api "${ARGS[@]}" > /dev/null && { echo "심박 기록"; exit 0; }
            sleep 5; gh api "$API?ref=data" --jq .sha > /tmp/hb_sha 2>/dev/null || true
          done
          echo "::warning::심박 기록 실패 (연동 결과에는 영향 없음)"; exit 0
