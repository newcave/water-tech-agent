name: kci-affil-probe
# 1회성 점검 (로그만, 커밋 없음) — 확인 후 삭제
on:
  push:
    branches: [claude/wizardly-fermi-mrihtw]
    paths: [scripts/kci_affil_probe.py, .github/workflows/kci-affil-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      - env:
          KCI_API_KEY: ${{ secrets.KCI_API_KEY }}
        run: python scripts/kci_affil_probe.py
