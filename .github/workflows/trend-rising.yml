name: trend-rising

# 상승 연구주제 탐지 v0.1 — OpenAlex 집계 API만 사용 (원문 다운로드 없음), 주 1회 (+ 수동 실행)
on:
  schedule:
    - cron: "23 21 * * 0"        # 매주 일요일 21:23 UTC (월요일 06:23 KST) — kci-counts 이후
  workflow_dispatch: {}
  push:                          # 작업 브랜치 시험 실행 (커밋은 main에서만)
    branches: [claude/wizardly-fermi-mrihtw]
    paths: [agents/trend_rising.py, .github/workflows/trend-rising.yml]

permissions:
  contents: write

concurrency:
  group: trend-rising
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests numpy pymannkendall
      - name: 상승 주제 분석
        run: python agents/trend_rising.py
      - name: 결과 커밋·푸시 (main만)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "co-scientist-bot"
          git config user.email "co-scientist-bot@users.noreply.github.com"
          git add data_seed/trend_rising.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          git commit -m "🤖 trend_rising: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          echo "push 실패(3회)"; exit 1
