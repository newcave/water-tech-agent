name: labels-pipeline

on:
  schedule:
    - cron: "23 20 * * *"          # 매일 05:23 KST (UTC 20:23)
  workflow_dispatch:
    inputs:
      scope:
        description: "수집 깊이 (small=1년 증분 / medium=3년 / large=5년)"
        type: choice
        options: [small, medium, large]
        default: small
      max_items:
        description: "이번 실행의 mini 처리 상한 (추출·배정 각각)"
        default: "3000"

permissions:
  contents: write

concurrency:
  group: labels-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install openai

      - name: run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: |
          python labels_pipeline.py \
            --scope "${{ inputs.scope || 'small' }}" \
            --max-items "${{ inputs.max_items || '3000' }}"

      - name: commit & push (data)
        run: |
          git config user.name  "labels-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add labels/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          git commit -m "labels: pipeline ${{ inputs.scope || 'small' }} $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin data && git push origin HEAD:data && exit 0
            sleep 15
          done
          echo "push 실패(3회)"; exit 1
