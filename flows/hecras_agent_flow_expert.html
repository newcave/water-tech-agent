     노드·연결선·재생 단계는 아래 N·E·SCN 표에 있다. 코드가 바뀌면 이 표만 고친다. 실시간 상태는 보이지 않는다(구조도).
     전문가 보기: 기본 보기(flows/hecras_agent_flow.html)와 같은 틀에 사양·수식(m), 연결선 자료 표시를 더했다. -->
<style>
:root{--bg0:#050f22;--bg1:#0b2447;--ink:#e6eefb;--mut:#8ea6c8}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg0);font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;color:var(--ink);overflow:hidden}
#wrap{position:relative;width:100%;height:100vh;background:radial-gradient(1200px 700px at 55% 40%,#0e2c57 0%,var(--bg1) 35%,var(--bg0) 100%);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}

#top{left:18px;top:14px;right:18px;display:flex;align-items:flex-start;gap:14px}
#ttl{font-weight:900;font-size:19px;letter-spacing:-.2px;white-space:nowrap}
#ttl small{display:block;font-weight:500;font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap}
#kpis{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.chip{background:rgba(16,40,80,.72);border:1px solid rgba(120,160,220,.25);border-radius:999px;padding:4px 11px;font-size:12px;color:#cfe0f7;white-space:nowrap;backdrop-filter:blur(4px)}
.chip b{color:#fff;font-weight:800}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#94a3b8;margin-right:6px;vertical-align:0}

button:hover{background:rgba(36,70,130,.9)}
#panel{right:16px;top:100px;width:300px;max-height:calc(100% - 170px);overflow:auto;pointer-events:auto;background:linear-gradient(180deg,rgba(9,26,54,.9),rgba(9,26,54,.7));border:1px solid rgba(120,160,220,.18);border-radius:12px;padding:10px 12px;font-size:12px}
#panel h4{margin:0 0 8px;font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.06em}

.sc.on{background:#1d4ed8;border-color:#60a5fa;color:#fff}

#ctl{display:flex;gap:6px}
#ctl #play{flex:1}
#cap{left:50%;transform:translateX(-50%);bottom:46px;width:max-content;max-width:min(760px,62%);background:rgba(9,26,54,.88);border:1px solid rgba(120,160,220,.3);border-radius:10px;padding:7px 14px;font-size:13.5px;text-align:center;line-height:1.45}

#legend{left:16px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);background:rgba(9,26,54,.6);border-radius:10px;padding:6px 10px}
#legend i{display:inline-block;width:14px;height:10px;margin-right:5px;vertical-align:-1px;border:2px solid #9fb6d8;border-radius:3px}
#legend i.bt{border-style:dashed}#legend i.ex{border-style:dotted}
#legend b{color:#c4b5fd;margin-right:4px}
#card{left:16px;top:100px;width:340px;max-height:calc(100% - 170px);overflow:auto;background:rgba(9,26,54,.95);border:1px solid rgba(120,160,220,.3);border-radius:12px;padding:12px 14px;font-size:12.5px;display:none;pointer-events:auto;line-height:1.45}
#card h3{margin:0 0 6px;font-size:15px;padding-right:18px}
#card .bd{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;margin:0 4px 6px 0;background:rgba(56,100,170,.35);color:#dbe8fb}
#card .bd.llm{background:rgba(167,139,250,.3);color:#e9e2ff}
#card ul{margin:4px 0 6px;padding-left:18px}#card li{margin:2px 0}
#card .h{color:var(--mut);margin-top:6px;font-weight:700;font-size:11.5px}

@media (max-width:760px){#kpis,#legend,#ttl small{display:none}#cap{max-width:94%;bottom:12px;font-size:12.5px}#panel{top:100px;width:calc(100% - 32px)}}
#tip{position:absolute;pointer-events:none;background:rgba(5,15,34,.95);border:1px solid rgba(120,160,220,.3);border-radius:8px;padding:7px 10px;font-size:12px;display:none;max-width:280px;line-height:1.45}
</style></head><body>
<div id="wrap">
 <canvas id="cv"></canvas>
 <div class="hud" id="top">
  <div id="ttl">🔬 HEC-RAS 서로게이트 · 전문가 보기<small>HEC-RAS Surrogate Studio · 코드 기준 main 30c0fc5 (2026-08-18)</small></div>
  <div id="kpis"></div>
 </div>
 <div id="btns"><button id="fs">⛶ 전체 화면</button><button id="rs">⟲ 시점 초기화</button><button id="pa">⏸ 정지</button><button id="pn">☰ 재생 패널 숨기기</button></div>
 <div class="hud" id="panel">
  <h4>▶ 흐름 재생 · 실제 코드 경로</h4>
  <div id="chips"></div>
  <div id="sttl"></div><div id="sex"></div>
  <ol id="steps"></ol>
  <div id="ctl"><button id="prev">◀</button><button id="play">⏸ 자동 재생 중</button><button id="next">▶</button></div>
 </div>
 <div class="hud" id="cap"></div>
 <div class="hud" id="legend"><span><i></i>앱 안에서 실행</span><span><i class="bt"></i>앱 밖 (오프라인)</span><span><i class="ex"></i>자료 파일</span><span style="color:#cfe0f7">선 위 글자 = 넘겨주는 자료</span><span style="opacity:.8">빛나는 길 = 지금 재생 중인 단계 · 점 = 요청·자료의 이동 방향</span></div>
 <div class="hud" id="card"><span class="x" id="cx">✕</span><div id="cb"></div></div>
 <div id="tip"></div>
</div>
<script>
// ───────────────────────── 구조 (코드 기준) ─────────────────────────
// 전문가 보기: 노드 이름·부제는 기술 용어, 카드에 사양(m), 연결선 위에 넘겨주는 자료(label)
const COLS = [["정답 (Ground truth)",90],["자료",300],["학습·검증",520],["대리모델",740],["후보 탐색",960],["제약 최적화",1180],["결과·확인",1400]];
const VW = 1510, VH = 635;
const GC = {src:"#7dd3fc", data:"#3b82f6", train:"#14b8a6", sur:"#a78bfa", search:"#f59e0b", design:"#fb923c", ppl:"#f472b6"};
const C = n => n.c || GC[n.g];
const KIND = {on:"앱 안에서 실행", batch:"앱 밖 (오프라인)", ext:"자료 파일", ppl:"사람"};
// g: 단계 색, c: 노드 색(선택), k: on|batch|ext|ppl, m: 사양·수식
const N = [
 {id:"sample", col:0, row:0.3, g:"src", k:"on", icon:"🧪", label:"합성 정답 (견본)", sub:"합성 GT · LHS 200",
  d:["업로드가 없을 때 모든 화면을 쓰게 하는 합성 정답 — 실제 HEC-RAS 결과가 아님","설계 표본 → 수문 용량 거르기 → 사다리꼴 방류 → 하도 추적 → 수위 변환"],
  m:["P ~ LHS(d=4, n=200, seed 42), q_base + Δq ≤ 1,200","q(t) = q_base + Δq · min(r↑(t), r↓(t)), 램프 2 h","하도: 비선형 저류 S = k·O^0.8, k = 12 → 6 → 6 h (+ 지류 60 + 350·γ(t))","수위: h = 0.1319 · Q^0.5442 + 0.7478"], f:["app.py  (make_sample · release)"]},
 {id:"hecras", col:0, row:1.9, g:"src", k:"batch", icon:"🌊", label:"HEC-RAS 1D 부정류", sub:"Saint-Venant 1D 부정류",
  d:["워크숍 일괄 스크립트(저장소 밖)가 설계 시나리오마다 물리 모델을 실행","대리모델의 정답(Ground truth)이자 최종안 검증 도구"],
  m:["관심 지점 RS 5000, Δt = 1 h, 73단계","출력: hecras_dataset.npz (P · X · Y)"], f:["README.md  (Input data format)"]},
 {id:"load", col:1, row:0.6, g:"data", k:"on", icon:"📂", label:"자료 적재·정제", sub:"① Data · NaN 제거",
  d:["npz 업로드(최대 50MB) 또는 합성 정답","계산에 실패한 시나리오(수위 NaN) 제거","시나리오 수·첨두 수위 범위·방류량 범위·시간 단계 요약"],
  m:["ok = ¬isnan(Y[:, 0]) → P, X, Y = P[ok], X[ok], Y[ok]","V(P) = Δq · dur · 3600 / 10⁶ [Mm³]"], f:["app.py  (sidebar · ① Data · volume)", ".streamlit/config.toml  (maxUploadSize 50)"]},
 {id:"npz", col:1, row:1.9, g:"data", k:"ext", icon:"📦", label:"hecras_dataset.npz", sub:"P(N×4) · X,Y(N×73)",
  d:["P: 설계 변수 q_base · Δq · t_start · dur","X: 방류 수문곡선 (학습에 쓰지 않음)","Y: RS 5000 수위 시계열 — 학습 목표","저장소에 N = 200 파일 포함 (72KB)"],
  m:["P ∈ ℝ^(N×4), X ∈ ℝ^(N×73) [m³/s], Y ∈ ℝ^(N×73) [m]"], f:["hecras_dataset.npz", "README.md"]},

 {id:"mlp", col:2, row:0.0, g:"train", k:"on", icon:"🧠", label:"MLP 대리모델", sub:"f: ℝ⁴→ℝ⁷³ · 256-256",
  d:["다층 퍼셉트론으로 설계 변수 4개 → 시간별 수위 73개를 한 번에 회귀","은닉층 (256,256)·(128,128)·(128,128,128)·(64,64) 중 선택"],
  m:["ReLU · Adam · α(L2) = 1e-4 · η = 1e-3","max_iter = 8,000 · tol = 1e-7 · random_state 고정"], f:["app.py  (train_models)"]},
 {id:"cv", col:2, row:1.15, g:"train", k:"on", icon:"🔁", label:"K-fold 교차검증", sub:"K = 5 · OOF 예측",
  d:["모든 시나리오가 정확히 한 번 시험 — 겹 밖(OOF) 예측으로 일반화 오차 추정","스케일러는 겹의 학습분으로만 fit (정보 누수 방지)","겹별 첨두 MAE 산포로 표본 충분성 점검","같은 설정이면 다시 학습하지 않음 (st.cache_data)"],
  m:["KFold(K ∈ {3, 5, 10}, shuffle, random_state)","StandardScaler(P_tr), StandardScaler(Y_tr)","충분성 기준: σ(MAE_pk) < 0.3 · μ(MAE_pk)"], f:["app.py  (train_models · ② Training)"]},
 {id:"ridge", col:2, row:2.3, g:"train", k:"on", icon:"📏", label:"Ridge 기준선", sub:"선형 기준선 · α = 1",
  d:["같은 분할·같은 전처리에서 모델만 선형으로 바꾼 기준선","비선형 대리모델이 필요한 근거를 수치로 제시"],
  m:["Ridge(α = 1.0), 다중 출력 73"], f:["app.py  (train_models)"]},

 {id:"final", col:3, row:0.0, g:"sur", k:"on", icon:"⚡", label:"최종 서로게이트 f̂", sub:"전체 N 재학습",
  d:["같은 하이퍼파라미터로 전체 N개를 다시 학습 + 입력·출력 스케일러 보관","Saint-Venant를 풀지 않음 — 학습 분포 안에서의 내삽만 신뢰"],
  m:["f̂ = MLP(s_x(P)) → s_y⁻¹","(f̂, s_x, s_y) → session_state[\"model\"]"], f:["app.py  (train_models → final)"]},
 {id:"metrics", col:3, row:1.15, g:"sur", k:"on", icon:"📊", label:"검증 지표", sub:"NSE · RMSE · 첨두 오차",
  d:["OOF 예측으로 전체 시계열 정확도와 첨두 정확도를 따로 평가","Ridge 대비 개선 배수 · 예측 vs HEC-RAS 첨두 산점도"],
  m:["NSE = 1 − Σ(y − ŷ)² / Σ(y − ȳ)²","RMSE = √mean((y − ŷ)²)","e_pk = max_t ŷ − max_t y → MAE_pk, RMSE_pk"], f:["app.py  (train_models.stat · ② Training)"]},
 {id:"margin", col:3, row:2.3, g:"sur", k:"on", icon:"🛡️", label:"안전 여유 m", sub:"m = ⌈2·RMSE_pk⌉",
  d:["예측 불확실성을 설계 제약에 반영하는 여유 — 교차검증에서 산출 (추측 아님)","③ 화면 슬라이더 기본값, 연구자가 0~0.40 m에서 조정","P1에만 적용 (P2·P3는 H_THR 그대로)"],
  m:["m = ⌈2 · RMSE_pk · 100⌉ / 100 [m]"], f:["app.py  (auto_margin · solve)"]},

 {id:"pred", col:4, row:0.0, g:"search", k:"on", icon:"🚀", label:"일괄 추론", sub:"Ŷ = f̂(P′) · 1초 안팎",
  d:["남은 후보 전체를 행렬 한 번으로 추론 → 후보별 수위 시계열","같은 후보 설정이면 다시 계산하지 않음 (st.cache_data)"],
  m:["Ŷ = s_y⁻¹(f̂(s_x(P′))) ∈ ℝ^(n′×73)","HEC-RAS 환산 시간 = n′ × 4.2 s (6만 개 ≈ 70 h)"], f:["app.py  (screen)"]},
 {id:"qcap", col:4, row:1.15, g:"search", k:"on", icon:"🚧", label:"수문 용량 제약", sub:"q_base + Δq ≤ 1,200",
  d:["물리적으로 불가능한 후보(수문 용량 초과) 제거","제외된 후보 수를 화면에 표시"],
  m:["P′ = { p | q_base + Δq ≤ Q_CAP = 1,200 m³/s }"], f:["app.py  (screen · Q_CAP)"]},
 {id:"lhs", col:4, row:2.3, g:"search", k:"on", icon:"🎲", label:"LHS 후보 생성", sub:"d = 4 · 기본 6만",
  d:["라틴 하이퍼큐브 표본으로 4차원 설계 공간을 고르게 덮음","후보 수 1만·2만·6만·10만 중 선택"],
  m:["q_base ∈ [100, 400], Δq ∈ [100, 900] m³/s","t_start ∈ [2, 20], dur ∈ [6, 26] h · seed 11"], f:["app.py  (screen · LB/UB)"]},

 {id:"p2", col:5, row:0.0, g:"design", c:"#22c55e", k:"on", icon:"⏱️", label:"P2 초과 시간 최소", sub:"min 초과 시간 | V ≥ V_REQ",
  d:["필요 방류량을 채우면서 한계를 넘는 시간을 가장 짧게","동률이면 첨두가 낮은 후보"],
  m:["min Σ_t 1[ŷ_t > H_THR]  s.t.  V(p) ≥ V_REQ","tie-break: min max_t ŷ_t"], f:["app.py  (solve)"]},
 {id:"p3", col:5, row:1.15, g:"design", c:"#a78bfa", k:"on", icon:"📐", label:"P3 초과 면적 최소", sub:"min 초과 면적 | V ≥ V_REQ",
  d:["필요 방류량을 채우면서 한계 초과량 × 시간(면적)을 가장 작게","P2와 같은 제약 → 직접 비교 가능"],
  m:["min Σ_t (ŷ_t − H_THR)⁺ · Δt [m·hr]  s.t.  V(p) ≥ V_REQ"], f:["app.py  (solve)"]},
 {id:"p1", col:5, row:2.3, g:"design", c:"#f59e0b", k:"on", icon:"💧", label:"P1 최대 방류", sub:"max V | 첨두 ≤ H_THR − m",
  d:["수위 한계(여유 포함) 아래에서 추가 방류량을 가장 크게","방류량 제약이 없는 다른 문제 — P2·P3와 직접 비교하지 않음"],
  m:["max V(p)  s.t.  max_t ŷ_t ≤ H_THR − m","V(p) = Δq · dur · 3600 / 10⁶ [Mm³]"], f:["app.py  (solve)"]},

 {id:"user", col:6, row:0.0, g:"ppl", k:"ppl", icon:"👥", label:"연구자 (설계 조건)", sub:"H_THR · V_REQ · m",
  d:["사이드바: 자료 업로드, 은닉층·고급 하이퍼파라미터","③ 화면: 수위 한계 H_THR, 필요 방류량 V_REQ, 안전 여유 m, 후보 수","슬라이더 변경 시 즉시 재계산 (모델은 세션에 보관)"],
  m:["H_THR ∈ [P5, P95] of max_t Y (기본 P35)","V_REQ ∈ [10, max V] Mm³ (기본 P80)"], f:["app.py  (sidebar · ③ Optimize)"]},
 {id:"out", col:6, row:1.15, g:"design", k:"on", icon:"📋", label:"최적안 비교", sub:"비교 · best_release.json",
  d:["목표별 설계 변수·첨두·초과 시간·초과 면적·방류량 표","방류·수위 시계열, 설계 공간(방류량-첨두) 산점도, 지표 막대","P2 ≠ P3이면 trade-off(비지배) 문장 — 선택은 의사결정자 몫"],

function resample(raw, n){ const cum = [0]; for (let i = 1; i < raw.length; i++) cum.push(cum[i-1] + Math.hypot(raw[i][0]-raw[i-1][0], raw[i][1]-raw[i-1][1]));

    const seg = (cum[j+1] - cum[j]) || 1, u = Math.min(1, (d - cum[j]) / seg); out.push([raw[j][0] + (raw[j+1][0]-raw[j][0]) * u, raw[j][1] + (raw[j+1][1]-raw[j][1]) * u]); }

  seg(a.x + s * rr, Ly, b.x - s * rr, Ly, 40); q([b.x - s * rr, Ly], [b.x, Ly], [b.x, Ly - vb * rr], 8); seg(b.x, Ly - vb * rr, b.x, b.y, 12); return raw; }

function prevStep(){ if (cur.k > 0) cur.k--; else { cur.s = (cur.s - 1 + SCN.length) % SCN.length; cur.k = SCN[cur.s].s.length - 1; } applyStep(); }

let W = 0, H = 0, DPR = Math.max(1, window.devicePixelRatio || 1), zoom = 1, panX = 0, panY = 0;
let showPanel = true;
function resize(){ const r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W * DPR; cv.height = H * DPR; }

// 그래프 자리: 위 제목·단추 95px, 아래 설명 줄·범례 92px, 넓은 화면이면 오른쪽 재생 패널(330px)을 비켜 둔다

function tf(t){ const s = Math.min(area().aw / VW, area().ah / VH) * zoom; const {aw, ah} = area(); const drift = paused ? 0 : 1;
  const ox = (aw - VW * s) / 2 + 8 + panX + Math.sin(t * 0.07) * 5 * drift;

function hex(x, y, r){ ctx.beginPath(); for (let i = 0; i < 6; i++){ const ang = Math.PI / 3 * i; const px = x + r * Math.cos(ang), py = y + r * Math.sin(ang);
  i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.closePath(); }
function beam(e, alpha, w0, flip){ const P = e.pts, n = P.length, L = [], Rr = [];

    const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l; const tt = flip ? 1 - i / (n - 1) : i / (n - 1); const w = w0 * (1 - tt) + 0.9 * tt;
    L.push([p[0] - dy * w, p[1] + dx * w]); Rr.push([p[0] + dy * w, p[1] - dx * w]); }
  const a = byId[e.a], b = byId[e.b], g = ctx.createLinearGradient(a.x, a.y, b.x, b.y); g.addColorStop(0, C(a)); g.addColorStop(1, C(b));
  ctx.globalAlpha = alpha; ctx.fillStyle = g; ctx.beginPath(); L.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  for (let i = Rr.length - 1; i >= 0; i--) ctx.lineTo(Rr[i][0], Rr[i][1]); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1; }
function trace(e){ ctx.beginPath(); e.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); }
const stars = Array.from({length: 140}, () => ({x: Math.random(), y: Math.random(), z: Math.random() * 0.8 + 0.2}));

function draw(ms){
  const t = ms / 1000; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  // 자동 재생
  if (auto && !paused){ const last = cur.k === SCN[cur.s].s.length - 1; if (ms - stepAt > STEP_MS + (last ? END_MS : 0)) nextStep(); }
  for (const s of stars){ const x = (s.x * W + t * 6 * s.z) % W, y = s.y * H; ctx.globalAlpha = 0.25 + 0.5 * s.z * (0.6 + 0.4 * Math.sin(t * s.z * 2 + s.x * 9));

  const {s, ox, oy} = tf(t); ctx.setTransform(DPR * s, 0, 0, DPR * s, DPR * ox, DPR * oy);

  ctx.textAlign = "center"; ctx.font = "700 17px 'Noto Sans KR','Malgun Gothic',sans-serif";
  for (const [name, x] of COLS){ ctx.strokeStyle = "rgba(140,170,215,.10)"; ctx.lineWidth = 1; ctx.setLineDash([4, 8]);
    ctx.beginPath(); ctx.moveTo(x, 50); ctx.lineTo(x, VH - 40); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "rgba(170,195,230,.75)"; ctx.fillText(name, x, 36); }

    if (e.ghost && !on) continue;

    if (on){ ctx.save(); ctx.setLineDash([3, 11]); ctx.lineDashOffset = -t * 38 * actE.get(e); ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,.75)"; trace(e); ctx.stroke(); ctx.restore(); }
    if (e.label && (!e.ghost || on)){ const [x, y] = pointAt(e, e.lt || 0.5); ctx.font = "600 12.5px 'Noto Sans KR','Malgun Gothic',sans-serif";
      ctx.fillStyle = e.color ? `rgba(${e.color},.95)` : "rgba(196,215,240,.8)"; ctx.lineJoin = "round"; ctx.lineWidth = 4; ctx.strokeStyle = "rgba(6,18,40,.85)"; ctx.strokeText(e.label, x, y - 9); ctx.fillText(e.label, x, y - 9); }

  for (const p of packets){ if (!paused) p.t += p.sp / 60; if (p.t < 0) continue;
    const [x, y] = pointAt(p.e, p.dir > 0 ? p.t : 1 - p.t); const src = byId[p.dir > 0 ? p.e.a : p.e.b]; const rr = p.big ? 6.5 : 3.8;
    const g = ctx.createRadialGradient(x, y, 0, x, y, rr * 2.4); g.addColorStop(0, "#ffffff"); g.addColorStop(0.25, C(src)); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalAlpha = p.big ? 1 : (focus ? 0.35 : 0.7); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rr * 2.4, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
  // 노드
  for (const n of N){ const col = C(n), on = actN.has(n.id), dim = focus && !on;
    ctx.globalAlpha = dim ? 0.5 : 1;
    ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = on ? 34 + 10 * Math.sin(t * 4) : 14;
    hex(n.x, n.y, n.r); const g = ctx.createLinearGradient(n.x, n.y - n.r, n.x, n.y + n.r); g.addColorStop(0, "#16345f"); g.addColorStop(1, "#0a1d3c");
    ctx.fillStyle = g; ctx.fill(); ctx.restore();
    ctx.lineWidth = 2.2; ctx.strokeStyle = col; ctx.setLineDash(n.k === "batch" ? [6, 5] : n.k === "ext" ? [2, 4] : []); hex(n.x, n.y, n.r); ctx.stroke(); ctx.setLineDash([]);
    if (on){ const ph = (t * 0.8) % 1; ctx.lineWidth = 2.6; ctx.strokeStyle = "#e0f2fe"; ctx.globalAlpha = 1 - ph; hex(n.x, n.y, n.r + 6 + 7 * ph); ctx.stroke(); ctx.globalAlpha = 1; }
    else { ctx.lineWidth = 1.4; ctx.strokeStyle = col; ctx.globalAlpha = dim ? 0.2 : 0.4; hex(n.x, n.y, n.r + 6); ctx.stroke(); ctx.globalAlpha = dim ? 0.5 : 1; }
    ctx.font = (n.r < 40 ? 26 : 32) + "px 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(n.icon, n.x, n.y + 1); ctx.textBaseline = "alphabetic";
    if (n.llm){ const bx = n.x + n.r * 0.78, by = n.y - n.r * 0.72; ctx.fillStyle = "#4c1d95"; ctx.beginPath(); ctx.arc(bx, by, 10, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#c4b5fd"; ctx.lineWidth = 1.5; ctx.stroke(); ctx.fillStyle = "#ede9fe"; ctx.font = "700 13px sans-serif"; ctx.textBaseline = "middle"; ctx.fillText("✦", bx, by + 1); ctx.textBaseline = "alphabetic"; }
    ctx.lineJoin = "round"; ctx.strokeStyle = "rgba(6,18,40,.88)";   // 글자 뒤 어두운 테두리: 지나가는 선이 글자를 가리지 않게
    ctx.fillStyle = "#eaf2ff"; ctx.font = "800 18px 'Noto Sans KR','Malgun Gothic',sans-serif"; ctx.lineWidth = 5; ctx.strokeText(n.label, n.x, n.y + n.r + 23); ctx.fillText(n.label, n.x, n.y + n.r + 23);
    if (n.sub){ const sb = n.sub.length > 22 ? n.sub.slice(0, 21) + "…" : n.sub; ctx.fillStyle = "#9fb6d8"; ctx.font = "500 14px 'Noto Sans KR','Malgun Gothic',sans-serif"; ctx.lineWidth = 4; ctx.strokeText(sb, n.x, n.y + n.r + 42); ctx.fillText(sb, n.x, n.y + n.r + 42); }
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(draw);
}

// ───────────────────────── 마우스 ─────────────────────────
let drag = null; const tip = document.getElementById("tip");
function hit(mx, my){ const {s, ox, oy} = tf(performance.now() / 1000); const x = (mx - ox) / s, y = (my - oy) / s;
  return N.find(n => Math.hypot(n.x - x, n.y - y) < n.r + 8); }
cv.addEventListener("mousedown", e => { drag = {x: e.clientX, y: e.clientY, px: panX, py: panY, moved: false}; });
window.addEventListener("mouseup", e => { if (drag && !drag.moved){ const r = cv.getBoundingClientRect(); const n = hit(e.clientX - r.left, e.clientY - r.top); if (n) showCard(n); } drag = null; });
cv.addEventListener("mousemove", e => { const r = cv.getBoundingClientRect(); const mx = e.clientX - r.left, my = e.clientY - r.top;
  if (drag){ const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; panX = drag.px + dx; panY = drag.py + dy; tip.style.display = "none"; return; }
  const n = hit(mx, my); if (!n){ tip.style.display = "none"; return; }
  tip.innerHTML = `<b>${n.icon} ${esc(n.label)}</b>${n.llm ? " <span style='color:#c4b5fd'>✦ LLM</span>" : ""}<br>${esc(n.sub)}<br><span style="color:#8ea6c8">${KIND[n.k]} · 클릭하면 자세히</span>`;
  tip.style.display = "block"; tip.style.left = Math.min(mx + 14, W - 290) + "px"; tip.style.top = (my + 12) + "px"; });
cv.addEventListener("wheel", e => { e.preventDefault(); zoom = Math.min(2.4, Math.max(0.6, zoom * (e.deltaY < 0 ? 1.08 : 0.93))); }, {passive: false});
cv.addEventListener("dblclick", () => { zoom = 1; panX = panY = 0; });
function showCard(n){
  const lab = (e, other) => byId[other].label + (e.label && !e.lane ? ` (${e.label})` : "");
  const ins = E.filter(e => e.b === n.id && !e.ghost).map(e => lab(e, e.a)), outs = E.filter(e => e.a === n.id && !e.ghost).map(e => lab(e, e.b));
  let h = `<h3>${n.icon} ${esc(n.label)}</h3><span class="bd">${COLS[n.col][0]}</span><span class="bd">${KIND[n.k]}</span>${n.llm ? '<span class="bd llm">✦ LLM 사용</span>' : ""}`;
  h += `<div style="color:#9fb6d8">${esc(n.sub)}</div><ul>${n.d.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  if (ins.length || outs.length) h += `<div class="h">연결</div>` + (ins.length ? `<div>← ${ins.map(esc).join(" · ")}</div>` : "") + (outs.length ? `<div>→ ${outs.map(esc).join(" · ")}</div>` : "");
  if (n.m && n.m.length) h += `<div class="h">사양 · 수식</div>${n.m.map(x => `<div style="margin:2px 0"><code>${esc(x)}</code></div>`).join("")}`;
  h += `<div class="h">코드</div>${n.f.map(x => `<div><code>${esc(x)}</code></div>`).join("")}`;
  document.getElementById("cb").innerHTML = h; document.getElementById("card").style.display = "block"; }
document.getElementById("cx").onclick = () => document.getElementById("card").style.display = "none";
document.getElementById("fs").onclick = () => { const w = document.getElementById("wrap"); document.fullscreenElement ? document.exitFullscreen() : w.requestFullscreen && w.requestFullscreen(); };
document.getElementById("rs").onclick = () => { zoom = 1; panX = panY = 0; };
document.getElementById("pa").onclick = e => { paused = !paused; e.target.textContent = paused ? "▶ 움직임 재생" : "⏸ 정지"; stepAt = performance.now(); };
function setPanel(v){ showPanel = v; document.getElementById("panel").style.display = v ? "block" : "none"; document.getElementById("pn").textContent = v ? "☰ 재생 패널 숨기기" : "☰ 재생 패널 보기"; }
document.getElementById("pn").onclick = () => setPanel(!showPanel);

resize(); if (W < 760) setPanel(false); renderKpis(); applyStep(); requestAnimationFrame(draw);
</script></body></html>
